# 2b pair 1, the exact copy: uniform slowdown alpha_r = 1.15 on every region and no
# observation distortion. Produces the same law as pair1-passive.yaml with beta = 0.15
# and alpha = 1. Expected on passive data: both not_identifiable, same report.
graph:
  floors_ms:
    moe_routed: 2.0418
    attn_proj: 0.1855
    attn_compress: 0.1345
    moe_shared: 0.2360
    attn_core: 0.0729
    attn_index: 0.0433
    hc_mix: 0.1409
    collectives: 0.1150
    lm_head: 0.0288
    moe_router: 0.0431
    embed: 0.0001
  overlaps:
    - {earlier: moe_routed, later: moe_shared, overlap_ms: 0.2360}
    - {earlier: attn_index, later: attn_compress, overlap_ms: 0.0433}

slowdown:
  regions: [moe_routed, attn_proj, attn_compress, moe_shared, attn_core, attn_index, hc_mix, collectives, lm_head, moe_router, embed]
  alpha: 1.15
noise: {cv_region: 0.03, cv_total: 0.01}

conditions:
  - {name: passive, steps_fraction: 1.0, overrides: {}}
