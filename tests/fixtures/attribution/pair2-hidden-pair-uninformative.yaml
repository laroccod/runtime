# The same intervention applied to the *fully hidden* pair (moe_routed -> moe_shared, where
# the overlap equals the whole later floor): slowing the earlier region cannot lengthen
# an overlap already capped by the later region, so the arm is uninformative.
# Expected: serialization still not_identifiable, reason names the cap.
graph:
  floors_ms:
    moe_routed: 2.0418
    attn_proj: 0.1855
    attn_compress: 0.1345
    moe_shared: 0.2360
    attn_core: 0.0729
    attn_index: 0.0433
    hc_mix: 0.1409
    collectives: 0.1150
    lm_head: 0.0288
    moe_router: 0.0431
    embed: 0.0001
  overlaps:
    - {earlier: moe_routed, later: moe_shared, overlap_ms: 0.2360}
    - {earlier: attn_index, later: attn_compress, overlap_ms: 0.0433}

serialization: {s: 0.5}
noise:         {cv_region: 0.03, cv_total: 0.01}

conditions:
  - {name: passive,     steps_fraction: 0.5, overrides: {}}
  - {name: slow_routed, steps_fraction: 0.5, overrides: {slowdown: {alpha: {moe_routed: 1.3}}}}
